name: Public PR Policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release and QA metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Materialize pull-request body without checking out contributor code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            fs.writeFileSync('.pr-body.md', context.payload.pull_request.body || '')

      - name: Enforce release and QA metadata
        run: node scripts/check-pr-metadata.mjs .pr-body.md
