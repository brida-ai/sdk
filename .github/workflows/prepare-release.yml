name: Prepare SDK release

on:
  workflow_dispatch:
    inputs:
      impact:
        description: Semantic version impact for the next public SDK release
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: sdk-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare protected release branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify release arithmetic
        run: pnpm exec vitest run scripts/release/version.test.mjs

      - name: Prepare manifest version
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/prepare.mjs --impact "${{ inputs.impact }}" --apply | tee /tmp/release-plan.json
          VERSION="$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/release-plan.json','utf8').trim());process.stdout.write(x.version)")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse unexpected release mutations
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          test "$changed" = " M package.json"

      - name: Push release branch
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          BRANCH="release/$TAG"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch already exists: $BRANCH" >&2
            exit 1
          fi
          git config user.name "brida-release"
          git config user.email "release@brida.ai"
          git switch -c "$BRANCH"
          git add package.json
          git commit -m "chore(release): $TAG"
          git push origin "$BRANCH"

      - name: Require human-created release PR
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          BRANCH="release/$TAG"
          {
            echo "## Release branch prepared"
            echo
            echo "Branch `$BRANCH` was pushed."
            echo
            echo "Open a normal pull request from `$BRANCH` to `main` and use the repository PR template."
            echo "The PR must be created by a human/maintainer so normal `pull_request` CI is triggered; this workflow deliberately does not create the PR with `GITHUB_TOKEN`."
          } >> "$GITHUB_STEP_SUMMARY"
