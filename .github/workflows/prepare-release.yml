name: Prepare SDK release

on:
  workflow_dispatch:
    inputs:
      impact:
        description: Semantic version impact for the next public SDK release
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Open protected release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify release arithmetic
        run: pnpm exec vitest run scripts/release/version.test.mjs

      - name: Prepare manifest version
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/prepare.mjs --impact "${{ inputs.impact }}" --apply | tee /tmp/release-plan.json
          VERSION="$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/release-plan.json','utf8').trim());process.stdout.write(x.version)")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse unexpected release mutations
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          test "$changed" = " M package.json"

      - name: Open release branch and pull request
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          TAG="${{ steps.plan.outputs.tag }}"
          BRANCH="release/$TAG"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch already exists: $BRANCH" >&2
            exit 1
          fi
          git config user.name "brida-release"
          git config user.email "release@brida.ai"
          git switch -c "$BRANCH"
          git add package.json
          git commit -m "chore(release): $TAG"
          git push origin "$BRANCH"

          cat > /tmp/release-pr.md <<EOF
          ## Public change

          Prepare the immutable public SDK release `$TAG`. This PR changes only release metadata; it does not bypass normal public CI or review.

          ## Validation

          - [x] Public release version was computed from immutable Git tag history.
          - [x] No application/runtime behavior is changed by this release PR.
          - [x] Commits are narrowly scoped and atomic.

          ## Review / QA evidence

          Final release publication runs full `pnpm check`, `npm pack --dry-run`, exact-tag verification, and publishes only the merge commit of this reviewed PR.

          ## Compatibility / risk

          Release-only manifest version update. npm publication remains governed by Trusted Publishing/OIDC after the one-time bootstrap in issue #19.

          ## Release intent

          - release-impact: none
          - release-note: Prepare @brida/sdk $TAG for public publication.
          - qa-scope: Public CI, public-surface scan, package tarball inspection, exact-tag release finalization.
          EOF

          gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH"             --title "chore(release): $TAG" --body-file /tmp/release-pr.md
