name: Finalize SDK release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: sdk-release-finalize
  cancel-in-progress: false

jobs:
  release:
    name: Verify, tag and publish exact reviewed release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Re-run the full public release gates
        run: |
          pnpm check
          npm pack --dry-run

      - name: Verify release identity, bootstrap and target version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          EXPECTED_BRANCH="release/$TAG"
          if [ "${{ github.event.pull_request.head.ref }}" != "$EXPECTED_BRANCH" ]; then
            echo "Release branch must be $EXPECTED_BRANCH" >&2
            exit 1
          fi
          if ! npm view @brida/sdk version >/dev/null 2>&1; then
            echo "Complete the one-time npm bootstrap in issue #19 before automated releases." >&2
            exit 1
          fi
          if npm view "@brida/sdk@$VERSION" version >/dev/null 2>&1; then
            if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
              echo "Refusing first-attempt release: @brida/sdk@$VERSION already exists on npm." >&2
              exit 1
            fi
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.identity.outputs.tag }}"
          SHA="$(git rev-parse HEAD)"
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$TAG_SHA" != "$SHA" ]; then
              echo "Refusing to move existing tag $TAG from $TAG_SHA to $SHA" >&2
              exit 1
            fi
          else
            git config user.name "brida-release"
            git config user.email "release@brida.ai"
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish exact package through npm Trusted Publishing
        if: steps.identity.outputs.publish_needed == 'true'
        run: npm publish --access public --provenance

      - name: Verify npm publication
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.identity.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            if npm view "@brida/sdk@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Published package version did not become visible in npm." >&2
          exit 1

      - name: Create or verify GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.identity.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it immutable."
          else
            gh release create "$TAG" --repo "${{ github.repository }}"               --verify-tag --generate-notes --title "@brida/sdk ${{ steps.identity.outputs.version }}"
          fi
