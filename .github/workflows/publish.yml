name: Publish npm release (Trusted Publishing)

# Normal post-bootstrap release path. Requires npm Trusted Publisher configuration
# for brida-ai/sdk -> .github/workflows/publish.yml after the package has been bootstrapped.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'brida-ai/sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: |
          pnpm check
          npm pack --dry-run

      - name: Ensure tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "${{ github.event.release.tag_name }}" != "$expected_tag" ]; then
            echo "Release tag must be $expected_tag" >&2
            exit 1
          fi

      - name: Publish to npm with Trusted Publishing
        run: npm publish --access public --provenance
